name: iCloud Email Sync

on:
  schedule:
    - cron: '30 8 * * *'  # 8:30am UTC daily (9:30am BST)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic gspread google-auth

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Run iCloud sync
        env:
          ICLOUD_EMAIL:       ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_PASS:        ${{ secrets.ICLOUD_PASS }}
          CLAUDE_API_KEY:     ${{ secrets.CLAUDE_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID:           ${{ secrets.SHEET_ID }}
          APPS_SCRIPT_URL:    ${{ secrets.APPS_SCRIPT_URL }}
        run: python icloud_sync.py
